name: Extension Loading

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  extensions:
    name: Extensions (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10']
        include:
          - os: ubuntu-latest
            python: '3.11'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ActivitySim
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Test parent and worker extension imports
        run: >-
          uv run --locked --python ${{ matrix.python }} pytest
          activitysim/core/test/test_extensions.py
          activitysim/cli/test/test_extensions.py
          --junitxml=extension-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-results-${{ matrix.os }}-${{ matrix.python }}
          path: extension-results.xml
