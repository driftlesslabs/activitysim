name: Estimation Mode Testing

on:
  workflow_dispatch:
  push:
    paths:
      - 'activitysim/estimation/**'
      - '.github/workflows/estimation-tests.yml'

permissions:
  contents: read

jobs:
  estimation_mode:
    name: Windows estimation mode tests
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.7.12'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Clear generated estimation data
        run: >-
          uv run python -c "import pathlib, platformdirs, shutil;
          shutil.rmtree(pathlib.Path(platformdirs.user_cache_dir(appname='ActivitySim'))
          / 'estimation-test-base', ignore_errors=True)"
      - name: Test estimation mode and parameter comparisons
        run: >-
          uv run pytest activitysim/estimation/test/test_larch_estimation.py
          activitysim/estimation/test/test_parameter_regression.py
          --durations=0 --basetemp="${{ runner.temp }}/estimation-tests"
          --junitxml="${{ runner.temp }}/estimation-results.xml"
      - name: Save complete estimation comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estimation-regression-results
          path: |
            ${{ runner.temp }}/estimation-results.xml
            ${{ runner.temp }}/estimation-tests/**/*.csv
          retention-days: 14
